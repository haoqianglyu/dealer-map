name = "dealer-map"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [ { pattern = "dealermap.haoqianglyu.com", custom_domain = true } ]

# 只保留 console.log（被拒透传请求的 message_type）；关闭调用日志，不记录请求 URL/头/体（含 token、账号数据）
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[build]
command = "VITE_AMAP_SECURITY= VITE_FETCH_ALL=true VITE_PAGE_SIZE=100 npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Secret（不在仓库）：AMAP_JSCODE — 高德安全密钥，经 /_AMapService 代理追加 jscode
# Secret（不在仓库）：GEO_FC_URL — 共享坐标缓存 FC（cosyhome-dealermap-geo）触发器 URL，/geo-shared 代理到其 /geo
#   security find-generic-password -s chitu-amap-dealermap-security -w | npx wrangler secret put AMAP_JSCODE
# 小区坐标离线种子：worker/data/geo-seed.json + geo-overrides.json 打进 Worker 包（不在 dist/，/geo-seed.json 404），
#   登录后 GET /geo-shared/seed 凭平台 token（转发 /me 校验）下发。重新生成：开发环境「导出已确认坐标」→ 覆盖 worker/data/geo-seed.json → wrangler deploy
