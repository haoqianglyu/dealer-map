<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#040b18" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef2f6" media="(prefers-color-scheme: light)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>项目分布大屏</title>
    <script>try{var q=(location.hash.split('?')[1]||'')+'&'+location.search.slice(1),m=/(?:^|&)theme=(light|dark)/.exec(q),t=m?m[1]:localStorage.getItem('dm_theme');if(t==='light')document.documentElement.dataset.theme='light'}catch(e){}</script>
    <style>:root{--dm-boot-bg:#040b18}:root[data-theme=light]{--dm-boot-bg:#eef2f6}</style>
  </head>
  <body>
    <div id="app"><div style="position:fixed;inset:0;display:grid;place-items:center;background:var(--dm-boot-bg)"><i style="width:22px;height:22px;border:2px solid rgba(53,212,255,.2);border-top-color:#35d4ff;border-radius:50%;animation:b .9s linear infinite"></i></div><style>@keyframes b{to{transform:rotate(360deg)}}</style></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
